<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#0da2e7",
                "background-light": "#f5f7f8",
                "background-dark": "#101c22",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<title>PharmaBridge - Access Portal</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex min-h-screen w-full flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 lg:px-40 py-4 sticky top-0 z-50">
<div class="flex items-center gap-4">
<div class="text-primary">
<svg class="size-8" fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
</svg>
</div>
<h2 class="text-xl font-bold leading-tight tracking-tight">PharmaBridge</h2>
</div>
<div class="hidden md:flex gap-6 text-sm font-medium">
<a class="hover:text-primary" href="#">Home</a>
<a class="hover:text-primary" href="#">Pharmacies</a>
<a class="hover:text-primary" href="#">About Us</a>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-4 py-12">
<div class="w-full max-w-[480px] bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-slate-200 dark:border-slate-800 px-6">
<button class="flex-1 border-b-2 border-primary text-primary py-4 text-sm font-bold">
                        Login
                    </button>
<button class="flex-1 border-b-2 border-transparent text-slate-500 dark:text-slate-400 py-4 text-sm font-bold hover:text-slate-700 dark:hover:text-slate-200">
                        Register
                    </button>
</div>
<!-- Form Container -->
<div class="p-6 space-y-6">
<!-- Login View (Default) -->
<div class="space-y-4">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="e.g. 9876543210" type="tel"/>
</div>
<p class="text-xs text-red-500 font-medium mt-1 hidden">Please enter a valid mobile number</p>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between py-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary" type="checkbox"/>
<span class="text-xs text-slate-500 dark:text-slate-400 group-hover:text-slate-700">Remember me</span>
</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3.5 rounded-lg transition-colors shadow-md shadow-primary/20">
                            Sign In
                        </button>
</div>
<!-- Separator -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-slate-400 uppercase tracking-widest">Or</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<!-- Register View (Hidden by default, shown for structure context) -->
<div class="space-y-4 opacity-50 blur-[2px] pointer-events-none select-none">
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Full Name</label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none placeholder:text-slate-400" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mobile</label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none placeholder:text-slate-400" placeholder="98765..." type="tel"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Email (Optional)</label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none placeholder:text-slate-400" placeholder="john@example.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 text-red-500">Address</label>
<textarea class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-red-200 dark:border-red-900/30 rounded-lg outline-none placeholder:text-slate-400" placeholder="Street, Building, Flat..." rows="2"></textarea>
<p class="text-[11px] text-red-500 font-medium">Address is required for medicine delivery</p>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Confirm</label>
<input class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg outline-none placeholder:text-slate-400" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-slate-200 dark:bg-slate-800 text-slate-500 font-bold py-3.5 rounded-lg">
                            Register
                        </button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="p-8 text-center text-slate-400 dark:text-slate-600 text-sm">
<p>© 2024 PharmaBridge Solutions. All rights reserved.</p>
</footer>
</div>
<!-- OTP Verification Modal (Simulated success state) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
<div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 p-8 text-center space-y-6">
<div class="mx-auto size-16 bg-primary/10 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl">verified_user</span>
</div>
<div>
<h3 class="text-xl font-bold">Verify Mobile</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">We've sent a 4-digit code to <br/><span class="font-bold text-slate-700 dark:text-slate-200">+91 98765 43210</span></p>
</div>
<div class="flex justify-center gap-3">
<input class="size-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-center text-xl font-bold focus:ring-2 focus:ring-primary outline-none" maxlength="1" type="text" value="4"/>
<input class="size-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-center text-xl font-bold focus:ring-2 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="size-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-center text-xl font-bold focus:ring-2 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
<input class="size-12 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-center text-xl font-bold focus:ring-2 focus:ring-primary outline-none" maxlength="1" placeholder="·" type="text"/>
</div>
<div class="space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-lg transition-colors">
                    Verify &amp; Register
                </button>
<button class="text-xs font-semibold text-slate-400 hover:text-primary transition-colors">
                    Didn't receive code? Resend in 45s
                </button>
</div>
</div>
</div>
</body></html>
